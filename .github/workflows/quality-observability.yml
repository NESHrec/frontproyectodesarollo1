name: Quality and observability

on:
  pull_request:
  push:
    branches: [desarrollo, main, feature/observability]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: SonarQube analysis
        if: ${{ env.HAS_SONAR == 'true' }}
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          HAS_SONAR: ${{ secrets.SONAR_HOST_URL != '' && secrets.SONAR_TOKEN != '' }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
